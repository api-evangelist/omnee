name: Omnee
description: Omnee (Omnee AI) is a Techstars-backed startup providing an AI-powered customer care
  platform built for residential homebuilders. It pairs a per-home digital "home twin" data record
  with a personalized, multilingual AI assistant that handles buyer support and warranty management
  24/7, claiming to increase warranty-department capacity by over 60%. Products are sold per-home
  (Warranty Triage, AI Customer Care, and an Enterprise Partner tier with custom integrations). The
  company operates a marketing and product website but does not publish a public developer API,
  developer portal, or API documentation; this profile was enriched from its public site.
